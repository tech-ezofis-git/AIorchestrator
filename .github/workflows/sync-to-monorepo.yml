name: Sync to ezofis-app-v6 monorepo (agents/)

# Every push to main mirrors this repository into the agents/ folder of
# tech-ezofis-git/ezofis-app-v6. That repo's CI then rebuilds the agents
# Docker image and restarts the Azure Web App.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AIorchestrator (source)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout ezofis-app-v6 (monorepo)
        uses: actions/checkout@v4
        with:
          repository: tech-ezofis-git/ezofis-app-v6
          token: ${{ secrets.MONOREPO_SYNC_TOKEN }}
          path: monorepo

      - name: Mirror into agents/
        run: |
          mkdir -p monorepo/agents
          rsync -a --delete --exclude '.git' --exclude '.github' source/ monorepo/agents/

      - name: Commit and push
        working-directory: monorepo
        env:
          SOURCE_MSG: ${{ github.event.head_commit.message }}
        run: |
          git config user.name "aiorchestrator-sync"
          git config user.email "aiorchestrator-sync@users.noreply.github.com"
          git add -A agents
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          SUMMARY=$(printf '%s' "$SOURCE_MSG" | head -n 1)
          git commit -m "Sync agents/ from AIorchestrator@${GITHUB_SHA:0:7}: ${SUMMARY:-manual sync}"
          git push
